<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fraud Detection</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 0;
    }

    .header {
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .header .subtitle {
      font-size: 12px;
      opacity: 0.8;
    }

    .content {
      padding: 16px;
    }

    .status-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-label {
      font-size: 14px;
      color: #94a3b8;
    }

    .toggle-switch {
      position: relative;
      width: 52px;
      height: 28px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #475569;
      transition: 0.3s;
      border-radius: 28px;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    .toggle-switch input:checked + .toggle-slider {
      background: #22c55e;
    }

    .toggle-switch input:checked + .toggle-slider:before {
      transform: translateX(24px);
    }

    .result-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .result-icon {
      font-size: 24px;
    }

    .result-title {
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
    }

    .result-status {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .result-status.safe {
      color: #22c55e;
    }

    .result-status.warning {
      color: #f59e0b;
    }

    .result-status.danger {
      color: #ef4444;
    }

    .result-meta {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 8px;
    }

    .risk-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .risk-badge.low {
      background: #166534;
      color: #22c55e;
    }

    .risk-badge.medium {
      background: #78350f;
      color: #f59e0b;
    }

    .risk-badge.high {
      background: #7f1d1d;
      color: #ef4444;
    }

    .score-bar {
      height: 8px;
      background: #334155;
      border-radius: 4px;
      margin-top: 12px;
      overflow: hidden;
    }

    .score-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .score-fill.low {
      background: #22c55e;
    }

    .score-fill.medium {
      background: #f59e0b;
    }

    .score-fill.high {
      background: #ef4444;
    }

    .keywords {
      margin-top: 12px;
    }

    .keywords-title {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 6px;
    }

    .keyword-tag {
      display: inline-block;
      background: #334155;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      margin: 2px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .footer {
      padding: 12px 16px;
      border-top: 1px solid #1e293b;
      text-align: center;
    }

    .footer-text {
      font-size: 11px;
      color: #475569;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #334155;
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛡️ AI Fraud Detection</h1>
    <div class="subtitle">Real-time scam protection</div>
  </div>

  <div class="content">
    <!-- Status Toggle -->
    <div class="status-card">
      <div class="status-row">
        <span class="status-label">Protection</span>
        <label class="toggle-switch">
          <input type="checkbox" id="protectionToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- Loading State -->
    <div class="loading" id="loadingState">
      <div class="spinner"></div>
    </div>

    <!-- Last Scan Result -->
    <div class="result-card hidden" id="resultCard">
      <div class="result-header">
        <span class="result-icon" id="resultIcon">🤖</span>
        <span class="result-title">Last Scan Result</span>
      </div>

      <div class="result-status" id="resultStatus">SAFE</div>
      <div class="result-meta" id="resultMeta">No threats detected</div>

      <span class="risk-badge low" id="riskBadge">Low Risk</span>

      <div class="score-bar">
        <div class="score-fill low" id="scoreFill" style="width: 15%"></div>
      </div>

      <div class="keywords hidden" id="keywordsSection">
        <div class="keywords-title">Matched Keywords:</div>
        <div id="keywordsList"></div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="scanNowBtn">Scan Now</button>
        <button class="btn btn-secondary" id="clearBtn">Clear</button>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-text">AI Cyber Fraud Detection v1.0.0</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
